[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chubb-actuarial-analytics"
version = "1.0.0"
description = "CHUBB Actuarial Analytics & Grounded Conversational AI — Modular Four-Foundation Architecture (Databricks-Ready)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary"}
authors = [
    {name = "Chubb Actuarial Analytics Team"}
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
]
databricks = [
    "streamlit>=1.32.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["chubb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

